/**:
    ros__parameters:
      registration_method: "GICP_OMP"   #"GICP_OMP"     "NDT_OMP"
      score_threshold: 0.1              # Reject matches with score > threshold（拒绝分数高于此值的匹配）
      ndt_resolution: 0.5             # Voxel resolution for NDT (balance speed vs accuracy)（NDT体素分辨率）
      ndt_step_size: 0.1               # Step size for NDT optimization（NDT优化步长）
      ndt_num_threads: 2                 # More threads for faster processing
      ndt_max_iterations: 32            # More iterations for better convergence
      transform_epsilon: 0.001         # Convergence epsilon for transformation（变换收敛精度）

      # GICP-specific parameters (only used when registration_method="GICP_OMP")
      gicp_corr_dist_threshold: 3.0    # Max correspondence distance (m)（最大对应点距离）
      gicp_rotation_epsilon: 0.01      # Rotation convergence epsilon (rad)（旋转收敛精度）
      gicp_k_correspondences: 30       # Neighbors for covariance (lower for sparse maps)（协方差计算邻域数，稀疏地图用小值）
      gicp_max_optimizer_iterations: 32 # Inner BFGS max iterations（内部优化器最大迭代次数）
      gicp_epsilon: 0.001               # Tikhonov regularization for covariance inversion (higher = more stable on sparse maps)（协方差正则化，稀疏地图用较大值0.01~0.05）

      voxel_leaf_size: 0.1               # Smaller voxel size for better detail
      scan_max_range: 40.0               # Extended range for better matching
      scan_min_range: 0.1
      scan_period: 0.1
      use_pcd_map: true
      map_path: "/home/ztl/slam_data/3d_map/3dmap.pcd" #"/home/ywj/pcd/test.pcd"
      map_topic: "map3d"    #subscribe map topic
      set_initial_pose: true
      initial_pose_x: 0.0
      initial_pose_y: 0.0
      initial_pose_z: 0.0
      initial_pose_qx: 0.0
      initial_pose_qy: 0.0
      initial_pose_qz: 0.0
      initial_pose_qw: 1.0
      use_odom: true
      use_imu: false
      enable_debug: false
      enable_map_odom_tf: true
      global_frame_id: rkbot/map
      odom_frame_id: rkbot/odom
      base_frame_id: rkbot/base_footprint
      enable_timer_publishing: true
      pose_publish_frequency: 10.0
      
      # New parameters for improved localization
      displacement_threshold: 1.0        # Only update when displacement > 0.3m（位移触发阈值）
      search_radius: 2.0                 # Search radius around initial point（搜索半径）
      search_grid_size: 5                # Grid points per dimension for search（搜索网格密度）
      enable_displacement_check: true    # Enable displacement-based triggering（启用位移检查）
      enable_search_optimization: false   # Enable two-stage search for optimal localization（启用两阶段搜索优化）
      
      # New parameters for map downsampling（地图降采样参数）
      map_downsample_leaf_size: 0.5       # Leaf size for map downsampling in meters（地图降采样的leaf大小，单位：米）
      
      # New parameters for Z-axis search（Z轴搜索参数）
      enable_z_axis_search: false        # Enable Z-axis search for all triggers（启用Z轴搜索，对所有触发类型生效）
      
      # Two-stage search strategy:
      # Stage 1: Search Z-axis (if enabled, 5 times)
      # Stage 2: Search angles at best Z position (4 times) = 9 total (with Z) or 4 total (without Z)
      # Always performs angle search for better rotation convergence
      # 两阶段搜索策略：
      # 第一阶段：搜索Z轴（如果启用，5次）
      # 第二阶段：在最佳Z位置搜索角度（4次）= 总共9次（启用Z）或4次（不启用Z）
      # 总是执行角度搜索以获得更好的旋转收敛
      
      # New parameters for angle search optimization（角度搜索优化参数）
      enable_angle_search: false          # Enable angle search for better rotation convergence（启用角度搜索）
      angle_search_range: 0.2          # Angle search range in radians (±20 degrees)（角度搜索范围）
      angle_search_steps: 5              # Number of angle steps to try（角度搜索步数）
      
      # New parameters for dynamic score threshold mechanism
      enable_dynamic_threshold: false     # Enable dynamic threshold mechanism（启用动态阈值机制）
      dynamic_threshold_factor: 3.0      # Factor for dynamic threshold (new score must be <= current * factor)（动态阈值因子）
      
      # Initial localization accumulation（初始定位多帧叠加参数）
      initial_localization_accumulate_frames: 10  # Number of frames to accumulate for initial localization（初始定位叠加帧数，mid360非重复扫描建议10帧以上）
