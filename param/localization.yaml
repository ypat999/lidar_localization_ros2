/**:
    ros__parameters:
      registration_method: "GICP_OMP"       #"NDT_OMP"   #"GICP_OMP" 
      initial_score_threshold: 0.05        # 初始定位宽松阈值（可接受较差匹配）
      ongoing_score_threshold: 0.02       # 持续定位严格阈值（只接受精确匹配）
      # Per-axis fitness score thresholds（各轴独立阈值，默认与 ongoing_score_threshold 相同）
      # 只影响持续定位阶段，初始定位阶段仅用上面两个总阈值判断
      ongoing_score_threshold_x: 0.01    # X轴匹配误差平方和阈值
      ongoing_score_threshold_y: 0.01    # Y轴匹配误差平方和阈值
      ongoing_score_threshold_z: 0.01    # Z轴匹配误差平方和阈值
      ndt_resolution: 0.25               # Higher resolution for better accuracy
      ndt_step_size: 0.1               # Larger step size for better rotation convergence
      ndt_num_threads: 2                 # More threads for faster processing
      ndt_max_iterations: 64            # More iterations for better convergence
      transform_epsilon: 0.0002         # Convergence epsilon for transformation（变换收敛精度）

      # GICP-specific parameters (only used when registration_method="GICP_OMP")
      gicp_corr_dist_threshold: 3.0    # Max correspondence distance (m)（最大对应点距离）
      gicp_rotation_epsilon: 0.001      # Rotation convergence epsilon (rad)（旋转收敛精度）
      gicp_k_correspondences: 30       # Neighbors for covariance (lower for sparse maps)（协方差计算邻域数，稀疏地图用小值）
      gicp_max_optimizer_iterations: 64 # Inner BFGS max iterations（内部优化器最大迭代次数）
      gicp_epsilon: 0.001               # Tikhonov regularization for covariance inversion (higher = more stable on sparse maps)（协方差正则化，稀疏地图用较大值0.01~0.05）

      voxel_leaf_size: 0.1               # Smaller voxel size for better detail
      scan_max_range: 100.0               # Extended range for better matching
      scan_min_range: 0.1
      scan_period: 0.1
      use_pcd_map: true
      map_path: "/home/cat/slam_data/3d_map/3dmap.pcd" #"/home/ywj/pcd/test.pcd"
      set_initial_pose: true
      initial_pose_x: 0.0
      initial_pose_y: 0.0
      initial_pose_z: 0.0
      initial_pose_qx: 0.0
      initial_pose_qy: 0.0
      initial_pose_qz: 0.0
      initial_pose_qw: 1.0
      use_odom: true
      use_imu: false
      enable_debug: false
      enable_map_odom_tf: true
      global_frame_id: map
      odom_frame_id: odom
      base_frame_id: base_footprint
      enable_timer_publishing: true
      pose_publish_frequency: 10.0
      
      # New parameters for improved localization
      displacement_threshold: 3.0        # Only update when displacement > 0.3m（位移触发阈值）
      min_localization_interval: 2.0     # 最小重试间隔（秒），避免频繁计算
      search_radius: 2.0                 # Search radius around initial point（搜索半径）
      search_grid_size: 5                # Grid points per dimension for search（搜索网格密度）
      enable_displacement_check: true    # Enable displacement-based triggering（启用位移检查）
      enable_search_optimization: false   # Enable two-stage search for optimal localization（启用两阶段搜索优化）
      
      # New parameters for map downsampling（地图降采样参数）
      map_downsample_leaf_size: 0.5       # Leaf size for map downsampling in meters（地图降采样的leaf大小，单位：米）
      
      # New parameters for Z-axis search（Z轴搜索参数）
      enable_z_axis_search: false        # Enable Z-axis search for all triggers（启用Z轴搜索，对所有触发类型生效）
      
      # Two-stage search strategy:
      # Stage 1: Search Z-axis (if enabled, 5 times)
      # Stage 2: Search angles at best Z position (4 times) = 9 total (with Z) or 4 total (without Z)
      # Always performs angle search for better rotation convergence
      # 两阶段搜索策略：
      # 第一阶段：搜索Z轴（如果启用，5次）
      # 第二阶段：在最佳Z位置搜索角度（4次）= 总共9次（启用Z）或4次（不启用Z）
      # 总是执行角度搜索以获得更好的旋转收敛
      
      # New parameters for angle search optimization（角度搜索优化参数）
      enable_angle_search: false          # Enable angle search for better rotation convergence（启用角度搜索）
      angle_search_range: 0.2          # Angle search range in radians (±20 degrees)（角度搜索范围）
      angle_search_steps: 5              # Number of angle steps to try（角度搜索步数）
      
      # New parameters for dynamic score threshold mechanism
      enable_dynamic_threshold: false     # Enable dynamic threshold mechanism（启用动态阈值机制）
      dynamic_threshold_factor: 3.0      # Factor for dynamic threshold (new score must be <= current * factor)（动态阈值因子）
      
      # Initial localization accumulation（初始定位多帧叠加参数）
      initial_localization_accumulate_frames: 1  # Number of frames to accumulate for initial localization（初始定位叠加帧数，mid360非重复扫描建议10帧以上）

      # Origin baseline precision landing（原点基准精准降落）
      # 时序：启动后先在原点半径内积累 N 帧点云（按 map->base TF 变换到 map 系合并，
      # 全分辨率不降采样）作为独立基准地图，积累期间挂起全局图初始定位；
      # 基准就绪后再放行全局定位（可延后，不影响）；
      # 若未攒满就离圈则基准作废、立即恢复全局定位，本次降落退回全局图匹配；
      # 返航进入半径后切换到基准地图以 1Hz 直接匹配，仅以本次进圈后的最低误差结果更新 map->odom 静态TF；
      # 出圈后恢复全局图定位，下次起飞自然重新匹配。
      enable_origin_baseline: true
      origin_baseline_frames: 10           # 启动时积累的基准帧数（可配置）
      origin_baseline_radius: 1.5          # 原点触发半径（米，xy）
      origin_baseline_match_interval: 1.0  # 基准匹配周期（秒），默认1Hz
      origin_baseline_score_threshold: 1.0 # 降落匹配fitness上限，超过直接丢弃
      # 基准锚定坐标系：base_link（航点/控制点，与 /lio/robo/odom child 一致，
      # 实测方向与 TF 静态链一致）。前提：Livox_mid360_drone.py 中恒等
      # static_transform_map_to_odom 已注释（避免与 lidar_localization 双发布
      # /tf_static 竞态），且降落匹配有起飞武装门 + >30°/1m 跳变护栏兜底。
      origin_baseline_base_frame: base_link
      # 基准就绪后将点云按 map 系落盘（binary PCD），供 CloudCompare/RViz 检查拼接质量；留空禁用
      origin_baseline_pcd_path: /tmp/origin_baseline.pcd
